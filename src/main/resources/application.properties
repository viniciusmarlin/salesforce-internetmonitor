# ==========================================
# BANCO DE DADOS (PostgreSQL no Render / H2 Local)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/netmonitor_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8081}

# Console Web do H2 para visualizar as tabelas localmente (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# CONFIGURAÇÕES DO MONITORAMENTO TCP
# ==========================================
monitor.target.host=${MONITOR_TARGET_HOST:8.8.8.8}
monitor.target.port=${MONITOR_TARGET_PORT:53}
monitor.timeout.ms=${MONITOR_TIMEOUT_MS:3000}
monitor.failure.threshold=${MONITOR_FAILURE_THRESHOLD:3}

# ==========================================
# INTEGRAÇÃO SALESFORCE (Objeto Incident)
# ==========================================
salesforce.instance.url=${SALESFORCE_INSTANCE_URL:}
salesforce.client.id=${SALESFORCE_CLIENT_ID:}
salesforce.client.secret=${SALESFORCE_CLIENT_SECRET:}