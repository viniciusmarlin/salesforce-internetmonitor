# Banco de Dados (Usa variáveis da nuvem em produção; cai para H2 se rodar local)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/netmonitor_db}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Configurações do Monitor Real
monitor.target.host=8.8.8.8
monitor.target.port=53
monitor.timeout.ms=2000
monitor.failure.threshold=3

salesforce.instance.url=${SALESFORCE_INSTANCE_URL}
salesforce.client.id=${SALESFORCE_CLIENT_ID}
salesforce.client.secret=${SALESFORCE_CLIENT_SECRET}